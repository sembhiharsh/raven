appConfig:
  theme: default
  layout: auto
  iconSize: medium
  faviconApi: google
  language: es
  hideComponents:
    hideNav: true
    hideSearch: false
    hideSettings: true
  customCss: >-
    @import
    url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');


    body, html, #app, #thin {
      background: #080c14 !important;
      background-image: radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.12) 0%, rgba(8, 12, 20, 1) 80%) !important;
      color: #f1f5f9 !important;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      -webkit-font-smoothing: antialiased !important;
    }


    /* Executive Header */

    header.site-header, header {
      background: rgba(15, 23, 42, 0.85) !important;
      backdrop-filter: blur(16px) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      padding: 1.15rem 2.5rem !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
    }


    .options-outer, .settings-outer, footer, .indicators-container,
    .opening-method-icon {
      display: none !important;
    }


    /* Institutional Search Bar */

    .filter-container, section.filter-container {
      display: flex !important;
      justify-content: center !important;
      background: transparent !important;
      padding: 1.25rem 1rem 0.5rem 1rem !important;
    }


    .filter-container form {
      max-width: 680px !important;
      width: 100% !important;
      background: rgba(17, 24, 39, 0.92) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 14px !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35) !important;
      padding: 0.75rem 1.4rem !important;
      display: flex !important;
      align-items: center !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }


    .filter-container form:focus-within {
      border-color: #3b82f6 !important;
      background: rgba(17, 24, 39, 1) !important;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25), 0 12px 32px rgba(0, 0, 0, 0.5) !important;
    }


    .filter-container input#filter-tiles {
      font-size: 1rem !important;
      color: #f8fafc !important;
      border: none !important;
      outline: none !important;
      background: transparent !important;
      width: 100% !important;
      font-family: inherit !important;
    }


    .filter-container input#filter-tiles::placeholder {
      color: #64748b !important;
    }


    /* Grid layout */

    .item-group-container {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)) !important;
      gap: 1.75rem !important;
      max-width: 1880px !important;
      margin: 0 auto !important;
      padding: 1rem 2rem 7rem 2rem !important;
    }


    /* Section Cards (Quant Firm Dark Glassmorphism) */

    .collapsable {
      background: rgba(15, 23, 42, 0.78) !important;
      backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 18px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3) !important;
      padding: 1.4rem !important;
      margin: 0 !important;
      height: auto !important;
      display: flex !important;
      flex-direction: column !important;
      transition: all 0.25s ease !important;
    }


    .collapsable:hover {
      border-color: rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4) !important;
    }


    .section-header {
      margin-bottom: 1.15rem !important;
      padding-bottom: 0.85rem !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
    }


    .section-header h3 {
      color: #f8fafc !important;
      font-size: 0.95rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.06em !important;
      margin: 0 !important;
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
      text-transform: uppercase !important;
    }


    .section-header i, .section-header svg {
      font-size: 1.1rem !important;
    }


    .there-are-items {
      display: grid !important;
      grid-template-columns: 1fr !important;
      gap: 10px !important;
      padding: 2px !important;
      height: auto !important;
      overflow: visible !important;
    }


    .item-wrapper {
      margin: 0 !important;
      min-width: 0 !important;
      width: 100% !important;
      display: flex !important;
    }


    /* Tile Items */

    .item-wrapper .item, a.item {
      display: flex !important;
      flex-direction: row !important;
      justify-content: flex-start !important;
      align-items: center !important;
      width: 100% !important;
      min-width: 0 !important;
      box-sizing: border-box !important;
      padding: 12px 16px !important;
      margin: 0 !important;
      gap: 14px !important;
      background: rgba(30, 41, 59, 0.5) !important;
      border: 1px solid rgba(255, 255, 255, 0.07) !important;
      border-radius: 14px !important;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15) !important;
      text-decoration: none !important;
      position: relative !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }


    .item-wrapper .item:hover, a.item:hover {
      background: rgba(30, 41, 59, 0.92) !important;
      border-color: rgba(59, 130, 246, 0.55) !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 24px -4px rgba(59, 130, 246, 0.28), 0 4px 10px rgba(0, 0, 0, 0.35) !important;
    }


    /* Icon Container */

    .item-icon {
      width: 44px !important;
      height: 44px !important;
      min-width: 44px !important;
      max-width: 44px !important;
      border-radius: 12px !important;
      background: rgba(15, 23, 42, 0.85) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex-shrink: 0 !important;
      padding: 7px !important;
      box-sizing: border-box !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      margin: 0 !important;
      transition: transform 0.2s ease !important;
    }


    .item-wrapper .item:hover .item-icon, a.item:hover .item-icon {
      transform: scale(1.06) !important;
      border-color: #60a5fa !important;
      background: rgba(37, 99, 235, 0.18) !important;
    }


    .tile-icon, .item-icon img {
      width: 26px !important;
      height: 26px !important;
      max-width: 26px !important;
      max-height: 26px !important;
      min-width: 26px !important;
      min-height: 26px !important;
      object-fit: contain !important;
      border-radius: 4px !important;
      margin: 0 !important;
      display: block !important;
    }


    .item-icon svg.simple-icons {
      width: 22px !important;
      height: 22px !important;
      max-width: 22px !important;
      max-height: 22px !important;
      fill: #f8fafc !important;
    }


    .item-icon i {
      font-size: 1.2rem !important;
      color: #38bdf8 !important;
    }


    .quant-fallback-icon {
      color: #38bdf8 !important;
      font-size: 1.2rem !important;
    }


    /* Text & Content Layout */

    .tile-title {
      flex: 1 1 0% !important;
      min-width: 0 !important;
      width: auto !important;
      height: auto !important;
      padding: 0 !important;
      margin: 0 !important;
      text-align: left !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      gap: 3px !important;
      overflow: hidden !important;
    }


    .tile-main-row {
      display: flex !important;
      align-items: center !important;
      width: 100% !important;
    }


    .tile-title span.text {
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 0.98rem !important;
      letter-spacing: -0.01em !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      display: block !important;
      width: 100% !important;
    }


    .tile-sub-row {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      flex-wrap: wrap !important;
      width: 100% !important;
    }


    .meta-desc {
      color: #94a3b8 !important;
      font-size: 0.74rem !important;
      font-weight: 500 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }


    .meta-sep {
      color: #475569 !important;
      font-size: 0.7rem !important;
    }


    /* Credentials & Action Area */

    .tile-actions-area {
      margin-left: auto !important;
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      flex-shrink: 0 !important;
    }


    /* Discrete Monospace Username Badge */

    .tile-username-badge {
      background: rgba(15, 23, 42, 0.8) !important;
      border: 1px solid rgba(255, 255, 255, 0.09) !important;
      border-radius: 6px !important;
      padding: 2px 7px !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 4px !important;
      font-size: 0.69rem !important;
      color: #94a3b8 !important;
      font-family: 'JetBrains Mono', monospace !important;
      cursor: pointer !important;
      transition: all 0.15s ease !important;
    }


    .tile-username-badge:hover {
      background: rgba(56, 189, 248, 0.15) !important;
      border-color: rgba(56, 189, 248, 0.4) !important;
      color: #38bdf8 !important;
    }


    .tile-username-badge i {
      font-size: 0.68rem !important;
    }


    /* Executive Passcode Badge */

    .tile-passcode-badge {
      background: rgba(15, 23, 42, 0.92) !important;
      border: 1px solid rgba(59, 130, 246, 0.35) !important;
      border-radius: 8px !important;
      padding: 4px 10px !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      font-size: 0.72rem !important;
      color: #60a5fa !important;
      font-family: 'JetBrains Mono', monospace !important;
      cursor: pointer !important;
      flex-shrink: 0 !important;
      white-space: nowrap !important;
      transition: all 0.15s ease !important;
    }


    .tile-passcode-badge:hover {
      background: rgba(37, 99, 235, 0.25) !important;
      border-color: #60a5fa !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.35) !important;
    }


    .tile-passcode-badge .eye-mini-btn {
      color: #64748b !important;
      background: transparent !important;
      border: none !important;
      padding: 0 2px !important;
      cursor: pointer !important;
      display: inline-flex !important;
      align-items: center !important;
    }


    .tile-passcode-badge .eye-mini-btn:hover {
      color: #f8fafc !important;
    }


    /* Section Category Glowing Accents */

    .collapsable:nth-child(8n+1) .section-header i, .collapsable:nth-child(8n+1)
    .section-header svg { color: #38bdf8 !important; }

    .collapsable:nth-child(8n+2) .section-header i, .collapsable:nth-child(8n+2)
    .section-header svg { color: #10b981 !important; }

    .collapsable:nth-child(8n+3) .section-header i, .collapsable:nth-child(8n+3)
    .section-header svg { color: #f59e0b !important; }

    .collapsable:nth-child(8n+4) .section-header i, .collapsable:nth-child(8n+4)
    .section-header svg { color: #818cf8 !important; }

    .collapsable:nth-child(8n+5) .section-header i, .collapsable:nth-child(8n+5)
    .section-header svg { color: #ec4899 !important; }

    .collapsable:nth-child(8n+6) .section-header i, .collapsable:nth-child(8n+6)
    .section-header svg { color: #eab308 !important; }

    .collapsable:nth-child(8n+7) .section-header i, .collapsable:nth-child(8n+7)
    .section-header svg { color: #06b6d4 !important; }

    .collapsable:nth-child(8n+8) .section-header i, .collapsable:nth-child(8n+8)
    .section-header svg { color: #a855f7 !important; }
